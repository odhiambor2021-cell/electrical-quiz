<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container center">
  <div class="card auth-card">
    <h1>Student Registration</h1>
    <p>Create your quiz account.</p>
    <form id="registerForm">
      <input id="fullName" placeholder="Full name" required>
      <input id="admissionNumber" placeholder="Admission number" required>
      <input id="email" type="email" placeholder="Email address" required>
      <input id="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" required>
      <input id="confirmPassword" type="password" placeholder="Confirm password" minlength="6" required>
      <button class="btn" type="submit">Create Account</button>
    </form>
    <p id="message" class="message"></p>
    <p>Already registered? <a href="login.html">Login</a></p>
  </div>
</div>
<script src="js/supabase.js"></script>
<script src="js/register.js"></script>
</body>
</html>
